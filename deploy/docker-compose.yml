version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: kredo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: kredo_db
      POSTGRES_USER: kredo_user
      POSTGRES_PASSWORD: kredo_password
    ports:
      - "5433:5432"
    volumes:
      - kredo_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U kredo_user -d kredo_db" ]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  kredo_pgdata:
