server:
  port: 8080
  max-http-request-header-size: 64KB

spring:
  application:
    name: kredo-backend

  # Konfigurasi Koneksi Database PostgreSQL (Docker yang tadi kita jalankan)
  datasource:
    url: jdbc:postgresql://localhost:5433/kredo_db
    username: kredo_user
    password: kredo_password
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      pool-name: KredoHikariPool

  # Konfigurasi JPA / Hibernate (ORM)
  jpa:
    # PERINGATAN ARSITEKTUR: Di aplikasi akuntansi enterprise, kita DILARANG menggunakan "ddl-auto: update".
    # Perubahan skema tabel harus 100% dikendalikan oleh script migrasi Flyway agar tidak ada kolom terhapus diam-diam.
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  # Konfigurasi Flyway (Version control skema database SQL)
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

kredo:
  jwt:
    # Kunci rahasia minimal 256-bit untuk penandatanganan HMAC-SHA256 JWT
    secret: kredo-super-secret-key-for-jwt-signing-general-ledger-accounting-2026-min-256-bits
    access-token-expiration-seconds: 900 # 15 Menit (Sesuai FR-AUTH-01)
    refresh-token-expiration-seconds: 604800 # 7 Hari Rotasi Refresh Token